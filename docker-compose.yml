version: "3.9"

services:
  backend:
    build: .
    container_name: zhku-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app/backend
      - ./crawler:/app/crawler
      - ./data:/app/data
      - ./docs:/app/docs
    command: uvicorn backend.app:app --host 0.0.0.0 --port 8000

  frontend:
    build: ./frontend
    container_name: zhku-agent-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
    depends_on:
      - backend
